name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Without a composer.lock every run gets the newest Craft and MCP SDK, so a
  # weekly run catches a change to the MCP attributes or the content-model
  # check interface before a user does.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, intl, mbstring, pdo, zip
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: PHPUnit + PHPStan
        run: composer check
