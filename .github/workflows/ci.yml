name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, intl, mbstring, pdo, zip
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: PHPUnit + PHPStan
        run: composer check
